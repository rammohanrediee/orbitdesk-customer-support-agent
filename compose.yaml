services:
  orbitdesk:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ORBITDESK_ENV: development
      ORBITDESK_DEMO_MODE: "1"
      ORBITDESK_DATABASE_URL: postgresql+psycopg://orbitdesk:${ORBITDESK_POSTGRES_PASSWORD:?Set ORBITDESK_POSTGRES_PASSWORD}@db:5432/orbitdesk
      ORBITDESK_OPERATOR_TOKEN: ${ORBITDESK_OPERATOR_TOKEN:-}
      ORBITDESK_RETENTION_DAYS: ${ORBITDESK_RETENTION_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orbitdesk
      POSTGRES_USER: orbitdesk
      POSTGRES_PASSWORD: ${ORBITDESK_POSTGRES_PASSWORD:?Set ORBITDESK_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitdesk -d orbitdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
