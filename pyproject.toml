[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitdesk-support-agent"
version = "0.3.0"
description = "A retrieval-grounded OrbitDesk support agent using OpenRouter."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "langgraph>=1,<2",
  "pydantic>=2.11,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3,<4",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
semantic = [
  "numpy>=2,<3",
  "sentence-transformers>=5,<6",
]
dev = [
  "coverage>=7.10,<8",
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "numpy>=2,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[project.scripts]
orbitdesk-support = "orbitdesk_support_agent.cli:main"
orbitdesk-evaluate = "orbitdesk_support_agent.evaluation:main"
orbitdesk-evaluate-answers = "orbitdesk_support_agent.answer_evaluation:main"
orbitdesk-experiment = "orbitdesk_support_agent.experiments:main"
orbitdesk-retention = "orbitdesk_support_agent.retention:main"
orbitdesk-api = "orbitdesk_support_agent.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["orbitdesk_support_agent"]
omit = [
  "*/cli.py",
  "*/sample_runner.py",
  "*/tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
  "src/orbitdesk_support_agent/schemas.py",
]
ignore_missing_imports = true
check_untyped_defs = true
