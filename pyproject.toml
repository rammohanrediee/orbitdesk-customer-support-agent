[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitdesk-support-agent"
version = "0.2.0"
description = "A retrieval-grounded OrbitDesk support agent using OpenRouter."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1,<2",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
semantic = [
  "numpy>=2,<3",
  "sentence-transformers>=5,<6",
]
local = [
  "accelerate>=1,<2",
  "torch>=2,<3",
  "transformers>=5,<6",
]
dev = [
  "coverage>=7.10,<8",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
]

[project.scripts]
orbitdesk-support = "orbitdesk_support_agent.cli:main"
orbitdesk-evaluate = "orbitdesk_support_agent.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["orbitdesk_support_agent"]
omit = [
  "*/cli.py",
  "*/local_llm.py",
  "*/sample_runner.py",
  "*/semantic_retriever.py",
  "*/tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
