<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 36px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Helvetica, Arial, sans-serif; fill: #475569; }
      .node-label { font: 600 19px Helvetica, Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .node-detail { font: 400 14px Helvetica, Arial, sans-serif; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-label { font: 600 14px Helvetica, Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .main { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .terminal { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .fallback { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .start-end { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="70" y="64" class="title">OrbitDesk Customer Support Agent</text>
  <text x="70" y="94" class="subtitle">LangGraph workflow with conditional routing, retrieval, verification, and one bounded retry</text>

  <!-- Main workflow -->
  <rect x="80" y="155" width="140" height="58" rx="29" class="start-end"/>
  <text x="150" y="184" class="node-label">User question</text>

  <rect x="300" y="145" width="180" height="78" rx="14" class="main"/>
  <text x="390" y="176" class="node-label">Triage</text>
  <text x="390" y="201" class="node-detail">classify request</text>

  <polygon points="610,134 725,184 610,234 495,184" class="decision"/>
  <text x="610" y="176" class="node-label">Conditional</text>
  <text x="610" y="201" class="node-detail">route</text>

  <rect x="790" y="145" width="185" height="78" rx="14" class="main"/>
  <text x="882" y="176" class="node-label">Retrieve</text>
  <text x="882" y="201" class="node-detail">relevant evidence</text>

  <rect x="1040" y="145" width="185" height="78" rx="14" class="main"/>
  <text x="1132" y="176" class="node-label">Generate</text>
  <text x="1132" y="201" class="node-detail">local HF model</text>

  <rect x="1040" y="345" width="185" height="78" rx="14" class="main"/>
  <text x="1132" y="376" class="node-label">Verify</text>
  <text x="1132" y="401" class="node-detail">grounding + safety</text>

  <polygon points="882,334 997,384 882,434 767,384" class="decision"/>
  <text x="882" y="376" class="node-label">Conditional</text>
  <text x="882" y="401" class="node-detail">result</text>

  <rect x="560" y="345" width="165" height="78" rx="14" class="decision"/>
  <text x="642" y="376" class="node-label">Retry</text>
  <text x="642" y="401" class="node-detail">revise once</text>

  <!-- Direct terminal routes -->
  <rect x="270" y="505" width="220" height="82" rx="14" class="terminal"/>
  <text x="380" y="536" class="node-label">Clarification</text>
  <text x="380" y="562" class="node-detail">ask for missing details</text>

  <rect x="535" y="505" width="220" height="82" rx="14" class="terminal"/>
  <text x="645" y="536" class="node-label">Out of scope</text>
  <text x="645" y="562" class="node-detail">return safe response</text>

  <rect x="800" y="505" width="220" height="82" rx="14" class="fallback"/>
  <text x="910" y="536" class="node-label">Safe failure</text>
  <text x="910" y="562" class="node-detail">bounded fallback</text>

  <rect x="1080" y="700" width="140" height="58" rx="29" class="start-end"/>
  <text x="1150" y="729" class="node-label">END</text>

  <!-- Main edges -->
  <path d="M220 184 H292" class="edge"/>
  <path d="M480 184 H487" class="edge"/>
  <path d="M725 184 H782" class="edge"/>
  <text x="754" y="162" class="edge-label">answer / escalate</text>
  <path d="M975 184 H1032" class="edge"/>
  <path d="M1132 223 V337" class="edge"/>
  <path d="M1040 384 H1005" class="edge"/>

  <!-- Verification result edges -->
  <path d="M767 384 H733" class="edge"/>
  <text x="746" y="365" class="edge-label">retry</text>
  <path d="M642 345 V285 H1132 V231" class="edge"/>
  <text x="850" y="274" class="edge-label">regenerate with feedback</text>
  <path d="M882 434 V497" class="edge"/>
  <text x="928" y="470" class="edge-label">failed again</text>
  <path d="M997 404 C1080 445 1150 530 1150 692" class="edge"/>
  <text x="1155" y="493" class="edge-label">valid</text>

  <!-- Triage terminal branches -->
  <path d="M570 220 C520 315 420 390 390 497" class="edge"/>
  <text x="438" y="357" class="edge-label">needs details</text>
  <path d="M600 230 C560 265 520 300 520 345 V465 C520 480 570 490 635 497" class="edge"/>
  <text x="568" y="315" class="edge-label">outside scope</text>
  <path d="M650 220 C700 245 745 255 750 300 V430 C750 465 820 485 890 497" class="edge"/>
  <text x="804" y="448" class="edge-label">triage failure</text>

  <!-- Terminal edges -->
  <path d="M380 587 V650 H1090 C1120 650 1140 670 1145 692" class="edge"/>
  <path d="M645 587 V630 H1105 C1130 630 1147 657 1149 692" class="edge"/>
  <path d="M910 587 V610 H1120 C1140 610 1150 650 1150 692" class="edge"/>

  <text x="70" y="846" class="subtitle">Loop protection: max_retries = 1 • Generation runs locally • Responses include structured JSON and evidence sources</text>
</svg>
